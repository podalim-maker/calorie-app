<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>治療介入</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: #f5f6fa; color: #333; padding-bottom: 100px; }
    .header { background: linear-gradient(135deg, #1a2980 0%, #0d1650 100%); color: white; padding: 20px 20px 24px; }
    .back-btn { background: none; border: none; color: rgba(255,255,255,.7); font-size: 14px; cursor: pointer; padding: 0; margin-bottom: 12px; display: flex; align-items: center; gap: 4px; }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header p  { font-size: 13px; color: rgba(255,255,255,.65); margin-top: 4px; }
    .content { padding: 20px 16px; max-width: 480px; margin: 0 auto; }

    /* 介入カード */
    .inv-card {
      background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      display: flex; align-items: flex-start; gap: 12px;
    }
    .inv-num {
      width: 28px; height: 28px; border-radius: 50%; background: #f0f3ff;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #1B2A8A; flex-shrink: 0; margin-top: 2px;
    }
    .inv-body { flex: 1; min-width: 0; }
    .inv-type-badge {
      display: inline-block; border-radius: 6px; padding: 2px 8px;
      font-size: 11px; font-weight: 700; margin-bottom: 6px;
    }
    .inv-name { font-size: 15px; font-weight: 700; color: #222; margin-bottom: 4px; word-break: break-all; }
    .inv-date { font-size: 12px; color: #888; }
    .inv-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .inv-edit-btn {
      background: none; border: none; color: #9BA4C7; cursor: pointer;
      padding: 4px; line-height: 1;
    }
    .inv-edit-btn:hover { color: #1B2A8A; }
    .inv-delete-btn {
      background: none; border: none; color: #CCC; font-size: 18px; cursor: pointer;
      padding: 4px; line-height: 1;
    }
    .inv-delete-btn:hover { color: #E53935; }

    /* 空状態 */
    .empty-state { text-align: center; padding: 40px 20px; color: #CCC; font-size: 14px; }

    /* 追加ボタン */
    .add-btn {
      width: 100%; padding: 14px; border: 2px dashed #C5CAE9; border-radius: 14px;
      background: none; color: #7986CB; font-size: 14px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 4px;
    }
    .add-btn:active { background: #f0f3ff; }

    /* ━━━ モーダル ━━━ */
    .overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 100; align-items: flex-end; justify-content: center;
    }
    .overlay.open { display: flex; }
    .sheet {
      background: white; border-radius: 20px 20px 0 0; width: 100%; max-width: 480px;
      padding: 24px 20px 40px; animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .sheet-title { font-size: 17px; font-weight: 700; margin-bottom: 20px; color: #222; }

    /* タイプ選択 */
    .type-selector { display: flex; gap: 10px; margin-bottom: 18px; }
    .type-btn {
      flex: 1; padding: 12px 8px; border-radius: 12px; border: 2px solid #E0E0E0;
      background: white; cursor: pointer; text-align: center; transition: all .15s;
    }
    .type-btn.active { border-color: var(--tc); background: var(--tbg); }
    .type-btn .type-icon { font-size: 22px; margin-bottom: 4px; display: block; }
    .type-btn .type-name { font-size: 12px; font-weight: 700; color: #555; }
    .type-btn.active .type-name { color: var(--tc); }

    /* フォーム */
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 12px; font-weight: 700; color: #888; margin-bottom: 6px; display: block; letter-spacing: .04em; }
    .form-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #E0E0E0; border-radius: 10px;
      font-size: 15px; color: #333; outline: none; background: white;
      -webkit-appearance: none;
    }
    .form-input:focus { border-color: #1B2A8A; }
    textarea.form-input { resize: vertical; min-height: 72px; font-family: inherit; line-height: 1.6; }

    .save-btn {
      width: 100%; padding: 14px; background: #1B2A8A; color: white; border: none;
      border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px;
    }
    .save-btn:active { background: #0d1650; }
    .cancel-btn {
      width: 100%; padding: 12px; background: none; border: none;
      color: #999; font-size: 14px; cursor: pointer; margin-top: 6px;
    }

    /* 凡例 */
    .legend { display: flex; gap: 16px; margin-bottom: 20px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="goBack()">‹ 戻る</button>
    <h1>治療介入</h1>
    <p>薬剤・パーソナルトレーニングなどの開始記録</p>
  </div>

  <div class="content">

    <!-- 凡例 -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:#1B2A8A;"></div>薬剤
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#27AE60;"></div>パーソナルトレーニング
      </div>
    </div>

    <!-- 介入リスト -->
    <div id="invList"></div>

    <!-- 追加ボタン -->
    <button class="add-btn" onclick="openModal(null)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      介入を追加
    </button>

  </div>

  <!-- ━━━ 追加 / 編集モーダル ━━━ -->
  <div class="overlay" id="addOverlay">
    <div class="sheet">
      <div class="sheet-title" id="modalTitle">介入を追加</div>

      <!-- タイプ選択 -->
      <div class="form-group">
        <label class="form-label">介入の種類</label>
        <div class="type-selector">
          <button class="type-btn active" id="type-medication"
            style="--tc:#1B2A8A;--tbg:#EEF1FF;"
            onclick="selectType('medication')">
            <span class="type-icon">💊</span>
            <span class="type-name">薬剤</span>
          </button>
          <button class="type-btn" id="type-training"
            style="--tc:#27AE60;--tbg:#E8F5E9;"
            onclick="selectType('training')">
            <span class="type-icon">🏋️</span>
            <span class="type-name">パーソナルトレーニング</span>
          </button>
        </div>
      </div>

      <!-- 名前 -->
      <div class="form-group">
        <label class="form-label" id="nameLabel">薬剤名</label>
        <input type="text" class="form-input" id="invNameInput" placeholder="例：リラグルチド">
      </div>

      <!-- 開始日 -->
      <div class="form-group">
        <label class="form-label">開始日</label>
        <input type="date" class="form-input" id="invDateInput">
      </div>

      <!-- 備考 -->
      <div class="form-group">
        <label class="form-label">備考（任意）</label>
        <textarea class="form-input" id="invMemoInput" placeholder="用量、担当者名など"></textarea>
      </div>

      <button class="save-btn" onclick="saveIntervention()">保存</button>
      <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
    </div>
  </div>

  <script>
    const TYPE_COLORS = { medication: '#1B2A8A', training: '#27AE60' };
    const TYPE_LABELS = { medication: '薬剤', training: 'パーソナルトレーニング' };
    const TYPE_NAMES  = { medication: '薬剤名', training: 'トレーナー名 / 施設名' };
    const TYPE_PH     = { medication: '例：リラグルチド', training: '例：〇〇ジム' };
    let selectedType = 'medication';
    let editingId = null;   // null=新規, number=編集中のid

    function loadInterventions() {
      return JSON.parse(localStorage.getItem('interventions') || '[]');
    }
    function saveInterventions(list) {
      localStorage.setItem('interventions', JSON.stringify(list));
    }

    function renderList() {
      const list = loadInterventions();
      const el = document.getElementById('invList');
      if (list.length === 0) {
        el.innerHTML = '<div class="empty-state">まだ介入記録がありません</div>';
        return;
      }
      el.innerHTML = list.map((iv, idx) => {
        const color = TYPE_COLORS[iv.type] || '#888';
        const typeLabel = TYPE_LABELS[iv.type] || iv.type;
        const d = iv.startDate.replace(/-/g, '/');
        const bg = iv.type === 'medication' ? '#EEF1FF' : '#E8F5E9';
        const memoHtml = iv.memo
          ? `<div style="font-size:12px;color:#888;margin-top:4px;white-space:pre-wrap;">${escapeHtml(iv.memo)}</div>` : '';
        return `
          <div class="inv-card">
            <div class="inv-num">${idx+1}</div>
            <div class="inv-body">
              <span class="inv-type-badge" style="background:${bg};color:${color};">${typeLabel}</span>
              <div class="inv-name">${escapeHtml(iv.name || '（名称未設定）')}</div>
              <div class="inv-date">開始：${d}</div>
              ${memoHtml}
            </div>
            <div class="inv-actions">
              <button class="inv-edit-btn" onclick="openModal(${iv.id})" title="編集">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>
              <button class="inv-delete-btn" onclick="deleteIntervention(${iv.id})" title="削除">×</button>
            </div>
          </div>`;
      }).join('');
    }

    function deleteIntervention(id) {
      const iv = loadInterventions().find(i => i.id === id);
      const name = iv ? (iv.name || '介入記録') : '介入記録';
      if (!confirm(`「${name}」を削除しますか？`)) return;
      saveInterventions(loadInterventions().filter(i => i.id !== id));
      renderList();
    }

    function openModal(id) {
      editingId = id;
      const isEdit = id !== null;
      document.getElementById('modalTitle').textContent = isEdit ? '介入を編集' : '介入を追加';

      if (isEdit) {
        const iv = loadInterventions().find(i => i.id === id);
        if (!iv) return;
        selectType(iv.type);
        document.getElementById('invNameInput').value = iv.name || '';
        document.getElementById('invDateInput').value = iv.startDate;
        document.getElementById('invMemoInput').value = iv.memo || '';
      } else {
        selectType('medication');
        document.getElementById('invNameInput').value = '';
        document.getElementById('invDateInput').value = todayStr();
        document.getElementById('invMemoInput').value = '';
      }
      document.getElementById('addOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('addOverlay').classList.remove('open');
      editingId = null;
    }

    function selectType(type) {
      selectedType = type;
      ['medication','training'].forEach(t => {
        document.getElementById('type-' + t).classList.toggle('active', t === type);
      });
      document.getElementById('nameLabel').textContent = TYPE_NAMES[type];
      document.getElementById('invNameInput').placeholder = TYPE_PH[type];
    }

    function saveIntervention() {
      const name = document.getElementById('invNameInput').value.trim();
      const date = document.getElementById('invDateInput').value;
      const memo = document.getElementById('invMemoInput').value.trim();
      if (!date) { alert('開始日を入力してください'); return; }

      let list = loadInterventions();
      if (editingId !== null) {
        // 編集
        const idx = list.findIndex(i => i.id === editingId);
        if (idx >= 0) {
          list[idx] = { ...list[idx], type: selectedType, name, startDate: date, memo };
        }
      } else {
        // 新規
        list.push({ id: Date.now(), type: selectedType, name, startDate: date, memo });
      }
      saveInterventions(list);
      closeModal();
      renderList();
    }

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0');
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function goBack() {
      if (document.referrer) history.back();
      else window.location.href = 'index.html';
    }

    document.getElementById('addOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    renderList();
  </script>
</body>
</html>
